[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Server-side function that texts the owner on each form submission (Twilio).
# Dormant until TWILIO_* env vars are set.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Friendly path for the live Google reviews function (see Reviews.tsx).
[[redirects]]
  from = "/api/reviews"
  to = "/.netlify/functions/reviews"
  status = 200

# Old Events page was removed (no more private dining room); send any stale
# links to Contact so they don't 404.
[[redirects]]
  from = "/events"
  to = "/contact/"
  status = 301
  force = true
[[redirects]]
  from = "/events/*"
  to = "/contact/"
  status = 301
  force = true

# Prerendered per-route HTML is served directly (Netlify serves existing files
# before applying this fallback). The fallback only catches client-side routes
# that have no prerendered file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Six-header security baseline (see feedback_security_headers_standard).
# CSP tuned for Cambria's actual stack: self-hosted fonts + assets, the Contact
# page Google Maps iframe, Netlify Forms POSTing to /, /api/reviews and
# /accessibility-widget.js on-origin. Clarity hosts allowlisted proactively so
# a future consent-gated add drops in without a CSP change.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(self), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' https://*.clarity.ms; frame-src 'self' https://www.google.com https://maps.google.com; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
